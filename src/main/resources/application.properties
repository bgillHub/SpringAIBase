spring.application.name=SpringAIBase
spring.ai.openai.api-key=lm-studio
spring.ai.openai.base-url=http://localhost:1234/v1
spring.ai.openai.chat.options.model=google/gemma-4-12b-qat
spring.ai.openai.embedding.options.model=text-embedding-nomic-embed-text-v1.5
spring.ai.openai.chat.options.temperature=1
#spring.ai.ollama.base-url=http://localhost:11434
#spring.ai.ollama.chat.options.model=llama3
#spring.ai.ollama.init.pull-model-strategy=when_missing
spring.autoconfigure.exclude= \
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration, \
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration, \
  org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration